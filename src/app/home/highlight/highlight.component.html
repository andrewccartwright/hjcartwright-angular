<div id="book-highlight" class="home-panel">
    <img class="highlight-image" [src]="bookHighlight.book.preorderImgSrc" [alt]="bookHighlight.book.title" />

    <div id="highlight-content">
        <h1>{{bookHighlight.title}}</h1>

        <p id="highlight-text">{{bookHighlight.highlight}}</p>
        <!-- <p id="preorder-text">Click below to purchase</p> --

        <!-- <a [routerLink]="`books/${bookHighlight.book.link}`" routerLinkActive="active" [state]="{book: bookHighlight.book}"> -->
        <a [href]="bookHighlight.book.preorderLink" target=_blank>
            <button id="highlight-button" mat-raised-button>Preorder Now</button>
        </a>
    </div> 
</div>
